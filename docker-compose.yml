services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: promote
      POSTGRES_PASSWORD: promote_dev
      POSTGRES_DB: promote_me
    ports:
      - "5432:5432"
    volumes:
      - promote_postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - promote_redis:/data
volumes:
  promote_postgres:
  promote_redis:
